<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<title>Offline — MailDesk</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f6f8fc;
         font-family: Roboto, 'Segoe UI', Arial, sans-serif; color:#1f1f1f; text-align:center; padding:24px; box-sizing:border-box; }
  img { width:84px; height:84px; }
  h1 { font-size:20px; margin:18px 0 6px; }
  p { color:#5e5e5e; margin:0 0 22px; }
  button { background:#0b57d0; color:#fff; border:0; border-radius:999px; padding:12px 28px; font-size:15px; font-weight:600; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>MailDesk needs an internet connection. Check your Wi-Fi or mobile data.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
